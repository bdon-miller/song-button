[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardprep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cardprep = "cardprep.cli:main"

[tool.setuptools]
packages = ["cardprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
