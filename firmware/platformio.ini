[env:native]
platform = native
test_framework = unity
build_flags = -I include -std=c++17

[env:qtpy]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
; The board default (tinyuf2-partitions-4MB.csv) has two 1408K OTA slots; the image is ~1.41 MB
; and does not fit. No-OTA variant: same NVS offset, keeps the UF2 partition, 2816K app slot.
board_build.partitions = tinyuf2-partitions-4MB-noota.csv
framework = arduino
lib_deps = https://github.com/schreibfaul1/ESP32-audioI2S.git#5bf339285bf681d8be2cc84a5f7529a12f2f7514
; The board JSON defines ARDUINO_USB_CDC_ON_BOOT=1; drop it so =0 below does not redefine it.
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -I include -DARDUINO_USB_CDC_ON_BOOT=0 -DBOARD_HAS_PSRAM
test_ignore = *

; Same firmware with timing logs over native USB serial.
[env:qtpy_debug]
extends = env:qtpy
build_unflags =
build_flags = -I include -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DSONGBTN_DEBUG
test_ignore = *
